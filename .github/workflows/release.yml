# Release: a tag v* builds ascii-earth with PyInstaller on four machines and puts
# one archive per OS and CPU on the GitHub release. Each archive holds the folder
# ascii-earth/ with the program, Python and the maps inside: nothing to install.
# install.sh and the Homebrew formula take these archives.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { runner: macos-14, target: darwin-arm64 }
          - { runner: macos-15-intel, target: darwin-x86_64 }
          - { runner: ubuntu-22.04, target: linux-x86_64 }
          - { runner: ubuntu-22.04-arm, target: linux-arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build
        run: make dist PY=python
      - name: Smoke test
        run: COLUMNS=60 LINES=20 dist/ascii-earth/ascii-earth --color none --body saturn > /dev/null
      - name: Pack
        run: tar -C dist -czf ascii-earth-${{ matrix.target }}.tar.gz ascii-earth
      - uses: actions/upload-artifact@v7
        with:
          name: ascii-earth-${{ matrix.target }}
          path: ascii-earth-${{ matrix.target }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum ascii-earth-*.tar.gz > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" ascii-earth-*.tar.gz SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --notes "One folder per OS and CPU with Python and the maps inside. Install: curl -fsSL https://raw.githubusercontent.com/pluttan/ascii-earth/main/install.sh | sh"
